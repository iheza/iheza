# Backend + Frontend reverse proxy for the IHEZA app.
# PERSISTENT COPY — lives in the /app PVC so it survives pod recreation.
# The self-healing script /app/.emergent/nginx/restore_proxy.sh copies this to
# /etc/nginx/nginx-backend-proxy.conf (which is NOT persistent) on every boot.
#
# Routing:
#   /api/*  -> FastAPI backend on 127.0.0.1:8001
#   /*      -> React dev server on 127.0.0.1:3000 (with WebSocket/HMR support)

user root;
worker_processes auto;
pid /run/nginx-backend-proxy.pid;
error_log /var/log/nginx/backend-proxy-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/backend-proxy-access.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Allow long-running uploads / SSE / websockets
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    upstream iheza_backend {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    upstream iheza_frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ---------- API ----------
        location /api/ {
            proxy_pass http://iheza_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # ---------- Backend docs / openapi (optional convenience) ----------
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://iheza_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Frontend (React dev server) ----------
        location / {
            proxy_pass http://iheza_frontend;
            proxy_http_version 1.1;

            # WebSocket support for HMR / live reload
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
        }
    }
}
